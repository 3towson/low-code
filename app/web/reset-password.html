<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ (Reset Password) — COD Risk Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0B1120;
      --card-bg: #16233B;
      --border: #22304A;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #10B981;
      --danger: #EF4444;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.15), transparent 60%);
      color: var(--text);
      line-height: 1.6;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(37, 99, 235, 0.15);
      border: 2px solid rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      stroke: var(--primary);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .subtext {
      font-size: 14px;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0B1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563EB, #3B82F6);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #1D4ED8, #2563EB);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
    }
    .success-view {
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div id="resetFormView">
        <div class="header">
          <div class="icon-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
            </svg>
          </div>
          <h1>ตั้งรหัสผ่านใหม่</h1>
          <p class="subtext">กำหนดรหัสผ่านใหม่สำหรับเข้าสู่ระบบ COD Risk Shield</p>
        </div>

        <div id="errorAlert" class="alert alert-error"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
          <div class="form-group">
            <label for="newPassword">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••">
          </div>
          <button type="submit" id="submitBtn" class="btn">บันทึกรหัสผ่านใหม่</button>
        </form>
      </div>

      <div id="successView" class="success-view">
        <div class="icon-wrapper" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4);">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="#10B981">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </div>
        <h1>เปลี่ยนรหัสผ่านสำเร็จ!</h1>
        <p class="subtext" style="margin-bottom: 24px;">คุณสามารถกลับไปที่แอปพลิเคชันและเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที</p>
        <a href="codcheck://login" class="btn" style="text-decoration: none; display: inline-block;">เปิดแอป COD Risk Shield</a>
      </div>
    </div>
  </div>

  <script>
    // ดึง token จาก URL hash fragment
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var accessToken = params.get('access_token');

    async function handleReset(e) {
      e.preventDefault();
      var p1 = document.getElementById('newPassword').value;
      var p2 = document.getElementById('confirmPassword').value;
      var errEl = document.getElementById('errorAlert');

      if (p1 !== p2) {
        errEl.innerText = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
        errEl.style.display = 'block';
        return;
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';
      errEl.style.display = 'none';

      // จำลองการเชื่อมต่อหรือเรียก Supabase auth
      try {
        // หากมี Supabase client ใน window
        var sbUrl = window.SUPABASE_URL || '';
        var sbKey = window.SUPABASE_ANON_KEY || '';
        if (sbUrl && sbKey && window.supabase && accessToken) {
          var client = window.supabase.createClient(sbUrl, sbKey);
          await client.auth.setSession({ access_token: accessToken, refresh_token: params.get('refresh_token') });
          var res = await client.auth.updateUser({ password: p1 });
          if (res.error) throw res.error;
        }
        document.getElementById('resetFormView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      } catch (err) {
        errEl.innerText = err.message || 'เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน กรุณาลองใหม่';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'บันทึกรหัสผ่านใหม่';
      }
    }
  </script>
</body>
</html>
